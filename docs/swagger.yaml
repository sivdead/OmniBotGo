host: localhost:8080
info:
  contact: {}
  description: 统一消息机器人管理平台API
  title: OmniBotGo API
  version: "1.0"
paths:
  /api/v1/bots:
    get:
      consumes:
      - application/json
      description: 根据条件查询机器人列表，支持分页和过滤
      parameters:
      - description: 状态
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - default: 1
        description: 页码，默认1
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，默认20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/v1.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.BotListResult'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
      summary: 获取机器人列表
      tags:
      - bots
    post:
      consumes:
      - application/json
      description: 创建新的机器人配置
      parameters:
      - description: 创建机器人请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateBotRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/v1.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.Bot'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "409":
          description: 机器人名称已存在
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
      summary: 创建新的机器人
      tags:
      - bots
  /api/v1/bots/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的机器人配置
      parameters:
      - description: 机器人ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "404":
          description: 机器人不存在
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
      summary: 删除机器人
      tags:
      - bots
    get:
      consumes:
      - application/json
      description: 根据ID获取指定机器人的详细信息
      parameters:
      - description: 机器人ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/v1.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.Bot'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "404":
          description: 机器人不存在
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
      summary: 获取机器人详情
      tags:
      - bots
    put:
      consumes:
      - application/json
      description: 更新指定机器人的配置信息
      parameters:
      - description: 机器人ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新机器人请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/usecase.UpdateBotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/v1.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/entity.Bot'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "404":
          description: 机器人不存在
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "409":
          description: 机器人名称已存在
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
      summary: 更新机器人配置
      tags:
      - bots
  /api/v1/channels:
    get:
      consumes:
      - application/json
      description: 根据条件查询通道列表，支持分页和过滤
      parameters:
      - description: 机器人ID
        in: query
        name: bot_id
        type: integer
      - description: 平台类型
        in: query
        name: platform_type
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - default: 1
        description: 页码，默认1
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，默认20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
