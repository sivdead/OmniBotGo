        type: string
      - description: 通道ID
        in: path
        name: channel_id
        required: true
        type: integer
      - description: 签名
        in: query
        name: signature
        type: string
      - description: 时间戳
        in: query
        name: timestamp
        type: string
      - description: 随机数
        in: query
        name: nonce
        type: string
      - description: 验证字符串
        in: query
        name: echostr
        type: string
      produces:
      - application/json
      responses:
        "200":
