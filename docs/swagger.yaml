            $ref: '#/definitions/v1.StandardResponse'
        "404":
          description: 通道不存在
          schema:
            $ref: '#/definitions/v1.StandardResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/v1.StandardResponse'
