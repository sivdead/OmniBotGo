version: "3.9"


x-db-environment: &x-db-environment
  MYSQL_ROOT_PASSWORD: "myAwEsOm3pa55@w0rd"
  MYSQL_DATABASE: "omnibotgo"
  MYSQL_USER: "user"
  MYSQL_PASSWORD: "myAwEsOm3pa55@w0rd"

x-rabbitmq-variables: &x-rabbitmq-variables
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # MySQL
  MYSQL_DSN: "user:myAwEsOm3pa55@w0rd@tcp(db:3306)/omnibotgo?charset=utf8mb4&parseTime=True&loc=Local"
  MYSQL_MAX_CONNECTIONS: "10"
  # gRPC
  GRPC_PORT: "8081"
  # RMQ
  RMQ_RPC_SERVER: "rpc_server"
  RMQ_RPC_CLIENT: "rpc_client"
  RMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"


services:
  db:
    container_name: db
    image: mysql
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.1-management
    environment:
      <<: *x-rabbitmq-variables
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      app_network:
        aliases:
          - rabbitmq.lvh.me

